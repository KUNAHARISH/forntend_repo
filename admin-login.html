<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Sri Sivani Exam Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-container">

  <div class="login-card">
    <div class="login-header">
      <h1>Admin Portal</h1>
      <p>Sign in to manage academic records</p>
    </div>

    <div class="alert-error" id="error-box"></div>

    <form id="admin-login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" class="form-control" placeholder="Enter username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-submit" id="btn-submit-text">Login</button>
    </form>

    <div class="login-footer">
      <a href="index.html">&larr; Back to Landing Page</a>
    </div>
  </div>

  <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
  <script>
    // Handle form submit
    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const errorBox = document.getElementById('error-box');
      const submitBtn = document.getElementById('btn-submit-text');
      
      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerText = 'Verifying...';

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          if (result.user.role !== 'admin') {
            // Log out if a student tried admin login
            await fetch('/api/auth/logout', { method: 'POST' });
            errorBox.innerText = 'Access denied. Student cannot access Admin portal.';
            errorBox.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.innerText = 'Login';
            return;
          }
          // Redirect to dashboard
          window.location.href = 'admin/dashboard.html';
        } else {
          errorBox.innerText = result.message || 'Invalid username or password';
          errorBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.innerText = 'Login';
        }
      } catch (err) {
        errorBox.innerText = 'Server error. Please try again later.';
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerText = 'Login';
      }
    });

    // Check if already logged in as Admin
    (async () => {
      try {
        const res = await fetch('/api/auth/me');
        const data = await res.json();
        if (data.authenticated && data.user.role === 'admin') {
          window.location.href = 'admin/dashboard.html';
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
